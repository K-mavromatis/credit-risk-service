# =============================================================================
# CI — Sprint 5, Card 4
# Lint (ruff) + format check + test suite (pytest) on every push / PR to main.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the job only needs to read the repository.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Python 3.11, not 3.10: scikit-learn==1.9.0 (pinned in requirements.txt to
  # match the version scoring_pipeline.pkl was pickled with) requires
  # Python >= 3.11 and ships no cp310 wheels. 3.11 is also what the Dockerfile
  # runs in production, so CI tests the same interpreter that serves traffic.
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          # The cache key is a hash of this file: a dependency change busts it.
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---- Static analysis (config: [tool.ruff] in pyproject.toml) ----------
      - name: Ruff lint
        # --output-format=github turns findings into inline PR annotations.
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

      # ---- Tests ------------------------------------------------------------
      # No database service needed: tests/conftest.py sets a dummy DATABASE_URL
      # and runs every DB test against in-memory SQLite.
      - name: Run tests
        run: pytest tests/
