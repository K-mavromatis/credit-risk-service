[project]
name = "credit-scoring-service"
version = "0.1.0"
description = "End-to-end ML microservice for credit default risk assessment"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Konstantinos Mavromatis" },
    { name = "Liza Zinkina" }
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.11.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.25.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.24.0",
    "ruff>=0.16.8,<0.17",
    "mypy>=1.8.0",
    "pre-commit>=3.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# =============================================================================
# Ruff — single tool for linting (Flake8 + plugins), import sorting (isort)
# and formatting (Black-compatible). Run:  ruff format .  &&  ruff check . --fix
# =============================================================================
[tool.ruff]
line-length = 88              # Black's default; also used by E501 and the formatter
target-version = "py310"      # enables pyupgrade fixes up to Python 3.10 syntax
src = [".", "src"]            # roots used to tell first-party from third-party
extend-exclude = ["src/ml_model/data"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors   (PEP 8)
    "W",    # pycodestyle warnings (PEP 8)
    "F",    # Pyflakes: unused imports/variables, undefined names (Flake8 core)
    "C90",  # mccabe complexity    (Flake8 core)
    "I",    # isort: import sorting
    "N",    # pep8-naming
    "UP",   # pyupgrade: modern syntax (list[str], X | None, collections.abc)
    "B",    # flake8-bugbear: likely bugs and design problems
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "BLE",  # flake8-blind-except
    "ANN",  # flake8-annotations: every signature must be typed
    "D",    # pydocstyle: docstrings (Google convention, see below)
    "RUF",  # Ruff-specific rules (incl. unused/invalid noqa)
]
ignore = [
    "ANN401",  # Any is legitimate for Pydantic mode="before" validators
    "D105",    # magic methods (__repr__, __eq__) are self-explanatory
]
allowed-confusables = ["–", "−"]  # typographic dashes shown in the Streamlit UI

[tool.ruff.lint.isort]
known-first-party = ["src"]
# The local alembic/ migrations folder would otherwise make ruff treat the
# alembic *package* as first-party and sort it next to our own imports.
known-third-party = ["alembic"]

[tool.ruff.lint.pydocstyle]
convention = "google"         # Args: / Returns: / Raises: sections

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["X", "X_*"]  # scikit-learn convention for feature matrices

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]               # descriptive test names are the documentation
"alembic/versions/*" = ["D"]    # autogenerated migrations
"notebooks/*" = [               # exploratory code: style only, no API docs
    "E501", "D", "ANN", "B905", "BLE001", "RUF005",
]

[tool.ruff.format]
# Black-compatible output.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true  # also format code examples inside docstrings

# Pytest settings
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

# Type checking (run: python -m mypy src/ml_model/streaming scripts)
[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true  # pandas/sklearn/joblib ship no stubs
